name: Migrate PostgreSQL 18.7 (CJD80)

concurrency:
  group: migrate-postgres-18-cjd80
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Taper MIGRATE_PG18 pour autoriser exécution ou inspection'
        required: true
        type: string
      mode:
        description: 'Mode exécution (inspect = lecture seule sans coupure)'
        required: false
        type: choice
        default: migrate
        options:
          - migrate
          - inspect

permissions:
  contents: read

jobs:
  migrate-cjd80-pg18:
    name: Migrate CJD80 PostgreSQL -> 18.7
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: cjd80
      url: https://cjd80.fr

    steps:
      - name: Validate manual confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "MIGRATE_PG18" ]; then
            echo "Confirmation invalide: saisir exactement MIGRATE_PG18"
            exit 1
          fi

      - name: Migrate PostgreSQL on CJD80 VPS
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            RUN_MODE="${{ github.event.inputs.mode || 'migrate' }}"

            if [ "$RUN_MODE" = "inspect" ]; then
              echo "=== HOST & PERMISSIONS ==="
              id
              if sudo -n true 2>/dev/null; then echo "SUDO=OK"; else echo "SUDO=NO"; fi
              ls -ld /docker /docker/cjd80 /docker/cjd80/nhost /docker/cjd80/supabase 2>&1 || true
              sudo -n ls -la /docker /docker/cjd80 /docker/cjd80/nhost /docker/cjd80/supabase 2>/dev/null || ls -la /docker /docker/cjd80 /docker/cjd80/nhost /docker/cjd80/supabase 2>&1 || true

              echo "=== DOCKER PS ==="
              docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'

              echo "=== INSPECT cjd-app ==="
              if docker inspect cjd-app >/dev/null 2>&1; then
                docker inspect cjd-app --format 'project={{index .Config.Labels "com.docker.compose.project"}} service={{index .Config.Labels "com.docker.compose.service"}} workdir={{index .Config.Labels "com.docker.compose.project.working_dir"}} cfg={{index .Config.Labels "com.docker.compose.project.config_files"}}'
                docker inspect cjd-app --format 'networks={{range $k,$v := .NetworkSettings.Networks}}{{$k}}(aliases={{json $v.Aliases}}) {{end}}'
                docker inspect cjd-app --format '{{range .Config.Env}}{{println .}}{{end}}' | python3 -c '
            import sys
            from urllib.parse import urlsplit
            for line in sys.stdin:
                line = line.rstrip("\n")
                if "=" not in line:
                    continue
                k, v = line.split("=", 1)
                if k in ("DATABASE_URL", "PGHOST", "PGPORT", "PGDATABASE", "PGUSER", "POSTGRES_HOST", "POSTGRES_DB", "POSTGRES_USER"):
                    if "://" in v:
                        p = urlsplit(v)
                        dbn = p.path.lstrip("/")
                        print(f"{k}: scheme={p.scheme} user={p.username} host={p.hostname} port={p.port} db={dbn}")
                    else:
                        print(f"{k}={v}")
            '
              else
                echo "cjd-app non trouvé"
              fi

              echo "=== INSPECT POSTGRES CONTAINERS ==="
              for cid in $(docker ps --format '{{.ID}} {{.Names}} {{.Image}}' | awk 'tolower($2) ~ /(postgres|db)/ || tolower($3) ~ /postgres/ {print $1}'); do
                cname=$(docker inspect "$cid" --format '{{.Name}}' | sed 's|^/||')
                echo "--- CONTAINER $cname ($cid) ---"
                docker inspect "$cid" --format 'image={{.Config.Image}} project={{index .Config.Labels "com.docker.compose.project"}} service={{index .Config.Labels "com.docker.compose.service"}} workdir={{index .Config.Labels "com.docker.compose.project.working_dir"}} cfg={{index .Config.Labels "com.docker.compose.project.config_files"}}'
                docker inspect "$cid" --format 'mounts={{range .Mounts}}{{.Type}}|{{.Name}}|{{.Source}}->{{.Destination}} {{end}}'
                docker inspect "$cid" --format 'networks={{range $k,$v := .NetworkSettings.Networks}}{{$k}}(aliases={{json $v.Aliases}}) {{end}}'
                pguser=$(docker inspect "$cid" --format '{{range .Config.Env}}{{println .}}{{end}}' | awk -F= '$1=="POSTGRES_USER"{print $2; exit}')
                pguser="${pguser:-postgres}"
                docker exec "$cid" psql -U "$pguser" -d postgres -tAc "SELECT 'version=' || current_setting('server_version') || ' checksums=' || current_setting('data_checksums');" 2>&1 || true
                docker exec "$cid" psql -U "$pguser" -d postgres -tAc "SELECT 'role=' || rolname || '|super=' || rolsuper || '|login=' || rolcanlogin || '|md5=' || (rolpassword LIKE 'md5%') FROM pg_authid WHERE rolname NOT LIKE 'pg_%' ORDER BY rolname;" 2>&1 || true
                dbs=$(docker exec "$cid" psql -U "$pguser" -d postgres -tAc "SELECT datname FROM pg_database WHERE datistemplate=false ORDER BY datname;" 2>/dev/null || true)
                for db in $dbs; do
                  echo "  DB=$db extensions=$(docker exec "$cid" psql -U "$pguser" -d "$db" -tAc "SELECT string_agg(extname || ':' || extversion, ',') FROM pg_extension;" 2>&1 || true)"
                done
                docker exec "$cid" psql -U "$pguser" -d postgres -tAc "SELECT 'conn=' || COALESCE(datname,'') || '|' || COALESCE(usename,'') || '|' || COALESCE(application_name,'') || '|' || COALESCE(client_addr::text,'local') FROM pg_stat_activity WHERE pid <> pg_backend_pid() ORDER BY datname, usename;" 2>&1 || true
              done

              echo "=== COMPOSE FILES UNDER /docker/cjd80 ==="
              for cf in /docker/cjd80/docker-compose*.yml /docker/cjd80/compose*.y*ml /docker/cjd80/*/docker-compose*.yml /docker/cjd80/*/compose*.y*ml; do
                [ -e "$cf" ] || continue
                ls -l "$cf" 2>/dev/null || sudo -n ls -l "$cf" 2>/dev/null || true
                if [ -r "$cf" ]; then
                  echo "services($cf)=$(docker compose -f "$cf" config --services 2>&1 | tr '\n' ' ')"
                elif sudo -n test -r "$cf" 2>/dev/null; then
                  echo "services($cf via sudo)=$(sudo -n docker compose -f "$cf" config --services 2>&1 | tr '\n' ' ')"
                else
                  echo "UNREADABLE: $cf"
                fi
              done
              exit 0
            fi

            cd /docker/cjd80

            PG_CID=$(docker ps --filter "name=^/cjd-postgres$" --filter "status=running" -q | head -n1 || true)
            if [ -z "$PG_CID" ]; then
              PG_CID=$(docker ps --filter "status=running" --format '{{.ID}} {{.Names}} {{.Image}}' \
                | awk '$3 ~ /(^|\/)postgres:/ && $2 ~ /cjd/ {print $1; exit}' || true)
            fi
            if [ -z "$PG_CID" ]; then
              PG_CID=$(docker ps --filter "status=running" --format '{{.ID}} {{.Names}} {{.Image}}' \
                | awk '$3 ~ /(^|\/)postgres:/ && $2 !~ /authentik|temporal|supabase/ {print $1; exit}' || true)
            fi
            if [ -z "$PG_CID" ]; then
              echo "Conteneur PostgreSQL actif introuvable sur le VPS :"
              docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
              exit 1
            fi

            PG_NAME=$(docker inspect "$PG_CID" --format '{{.Name}}' | sed 's|^/||')
            PG_SVC=$(docker inspect "$PG_CID" --format '{{index .Config.Labels "com.docker.compose.service"}}')
            PG_PROJ=$(docker inspect "$PG_CID" --format '{{index .Config.Labels "com.docker.compose.project"}}')
            PG_CFG_RAW=$(docker inspect "$PG_CID" --format '{{index .Config.Labels "com.docker.compose.project.config_files"}}')
            PG_WORKDIR=$(docker inspect "$PG_CID" --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}')
            echo "Conteneur PG détecté: name=$PG_NAME service=$PG_SVC project=$PG_PROJ cfg=$PG_CFG_RAW workdir=$PG_WORKDIR"

            [ -n "$PG_CFG_RAW" ] || { echo "Label compose config_files absent sur $PG_NAME"; exit 1; }
            IFS=',' read -ra COMPOSE_FILES <<< "$PG_CFG_RAW"
            COMPOSE_ARGS=()
            [ -n "$PG_PROJ" ] && COMPOSE_ARGS+=(-p "$PG_PROJ")
            for cf in "${COMPOSE_FILES[@]}"; do
              [ -f "$cf" ] || { echo "Fichier compose introuvable: $cf"; exit 1; }
              COMPOSE_ARGS+=(-f "$cf")
            done

            APP_PROJ=""; APP_CFG_RAW=""; APP_COMPOSE_ARGS=()
            if docker inspect cjd-app >/dev/null 2>&1; then
              APP_PROJ=$(docker inspect cjd-app --format '{{index .Config.Labels "com.docker.compose.project"}}' 2>/dev/null || true)
              APP_CFG_RAW=$(docker inspect cjd-app --format '{{index .Config.Labels "com.docker.compose.project.config_files"}}' 2>/dev/null || true)
              if [ -n "$APP_CFG_RAW" ] && [ "$APP_CFG_RAW" != "$PG_CFG_RAW" ]; then
                [ -n "$APP_PROJ" ] && APP_COMPOSE_ARGS+=(-p "$APP_PROJ")
                IFS=',' read -ra APP_FILES <<< "$APP_CFG_RAW"
                for cf in "${APP_FILES[@]}"; do
                  [ -f "$cf" ] && APP_COMPOSE_ARGS+=(-f "$cf")
                done
              fi
            fi

            PG_USER=$(docker inspect "$PG_CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | awk -F= '$1=="POSTGRES_USER"{print $2; exit}')
            PG_DB=$(docker inspect "$PG_CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | awk -F= '$1=="POSTGRES_DB"{print $2; exit}')
            PG_USER="${PG_USER:-postgres}"
            PG_DB="${PG_DB:-postgres}"

            CUR_VER=$(docker exec "$PG_CID" psql -U "$PG_USER" -d postgres -tAc "SHOW server_version;")
            if [[ "$CUR_VER" == 18.* ]]; then
              echo "Déjà sur PostgreSQL $CUR_VER — aucune migration nécessaire"
              exit 0
            fi

            MD5_CNT=$(docker exec "$PG_CID" psql -U "$PG_USER" -d postgres -tAc "SELECT COUNT(*) FROM pg_authid WHERE rolcanlogin AND rolpassword LIKE 'md5%';")
            [ "$MD5_CNT" -eq 0 ] || { echo "$MD5_CNT rôle(s) MD5 détecté(s) — convertir en SCRAM-SHA-256 avant bascule"; exit 1; }

            TS=$(date -u +%Y%m%d-%H%M%S)
            BACKUP_DIR="/docker/cjd80/backups/pg18-migration-${TS}"
            mkdir -p "$BACKUP_DIR" && chmod 700 "$BACKUP_DIR"

            docker exec "$PG_CID" pg_dumpall -U "$PG_USER" --roles-only > "${BACKUP_DIR}/roles.sql"
            DBS=$(docker exec "$PG_CID" psql -U "$PG_USER" -d postgres -tAc "SELECT datname FROM pg_database WHERE datistemplate=false ORDER BY datname;")
            DUMP_FILES=(roles.sql)
            for db in $DBS; do
              docker exec "$PG_CID" pg_dump -U "$PG_USER" --format=custom --no-owner --no-acl "$db" > "${BACKUP_DIR}/${db}.dump"
              test -s "${BACKUP_DIR}/${db}.dump"
              DUMP_FILES+=("${db}.dump")
            done
            (cd "$BACKUP_DIR" && sha256sum "${DUMP_FILES[@]}" > SHA256SUMS && sha256sum -c SHA256SUMS)

            for cf in "${COMPOSE_FILES[@]}"; do
              cp "$cf" "${cf}.bak-pre-pg18-${TS}"
            done

            rollback_pg16() {
              echo "⚠️ Échec détecté — rollback vers la configuration PG 16..."
              for cf in "${COMPOSE_FILES[@]}"; do
                [ -f "${cf}.bak-pre-pg18-${TS}" ] && cp "${cf}.bak-pre-pg18-${TS}" "$cf"
              done
              docker compose "${COMPOSE_ARGS[@]}" up -d || true
              if [ ${#APP_COMPOSE_ARGS[@]} -gt 0 ]; then
                docker compose "${APP_COMPOSE_ARGS[@]}" up -d || true
              fi
            }
            trap rollback_pg16 ERR

            if [ ${#APP_COMPOSE_ARGS[@]} -gt 0 ]; then
              APP_STACK_SVCS=$(docker compose "${APP_COMPOSE_ARGS[@]}" config --services | grep -Ev '^(redis|minio|traefik|caddy)$' | tr '\n' ' ' || true)
              [ -n "$APP_STACK_SVCS" ] && docker compose "${APP_COMPOSE_ARGS[@]}" stop $APP_STACK_SVCS || true
            fi
            PG_STACK_SVCS=$(docker compose "${COMPOSE_ARGS[@]}" config --services | grep -Ev "^(${PG_SVC}|redis|minio|traefik|caddy)$" | tr '\n' ' ' || true)
            [ -n "$PG_STACK_SVCS" ] && docker compose "${COMPOSE_ARGS[@]}" stop $PG_STACK_SVCS || true
            docker compose "${COMPOSE_ARGS[@]}" stop "$PG_SVC"

            PG_MOUNT=$(docker inspect "$PG_CID" --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Type}}|{{.Name}}|{{.Source}}{{end}}{{end}}')
            python3 - "$PG_PROJ" "$PG_MOUNT" "${COMPOSE_FILES[@]}" <<'PY'
            import re, sys

            proj = sys.argv[1]
            pg_mount = sys.argv[2]
            mount_parts = pg_mount.split("|") if pg_mount else ["", "", ""]
            vol_full = mount_parts[1] if len(mount_parts) > 1 else ""

            for path in sys.argv[3:]:
                with open(path, encoding="utf-8") as fh:
                    content = fh.read()
                mounts = re.findall(r'^\s*-\s*([^\s:#]+):/var/lib/postgresql/data\b', content, flags=re.M)
                content = re.sub(r'postgres:(?:1[4-7](?:\.[0-9]+)?(?:-alpine)?)(?:@sha256:[0-9a-f]+)?', 'postgres:18.7-alpine', content)
                content = content.replace('/var/lib/postgresql/data', '/var/lib/postgresql')
                vol_tokens = set()
                for src in mounts:
                    clean = src.rstrip('/')
                    if clean.startswith(('/', '.', '~')):
                        if not clean.endswith(('_pg18', '-pg18')):
                            content = content.replace(f'{src}:/var/lib/postgresql', f'{clean}_pg18:/var/lib/postgresql')
                    elif '${' not in clean:
                        vol_tokens.add(clean)
                if vol_full and not vol_full.endswith(('_pg18', '-pg18')):
                    vol_tokens.add(vol_full)
                    if proj and vol_full.startswith(f'{proj}_'):
                        vol_tokens.add(vol_full[len(proj) + 1:])
                for tok in sorted((t for t in vol_tokens if t and t not in {'postgres', 'db', 'data', 'pg', 'app'} and not t.endswith(('_pg18', '-pg18'))), key=len, reverse=True):
                    new_tok = f'{tok}_pg18' if '_' in tok or '-' not in tok else f'{tok}-pg18'
                    content = re.sub(rf'(?<![\w-]){re.escape(tok)}(?![\w-])', new_tok, content)
                with open(path, "w", encoding="utf-8") as fh:
                    fh.write(content)
            PY

            docker compose "${COMPOSE_ARGS[@]}" config -q
            docker compose "${COMPOSE_ARGS[@]}" up -d "$PG_SVC"
            NEW_CID=$(docker compose "${COMPOSE_ARGS[@]}" ps -q "$PG_SVC")
            [ -n "$NEW_CID" ] || { echo "Nouveau conteneur $PG_SVC introuvable"; exit 1; }
            for i in $(seq 1 30); do
              docker exec "$NEW_CID" pg_isready -U "$PG_USER" -d "$PG_DB" >/dev/null 2>&1 && break
              sleep 2
            done
            docker exec "$NEW_CID" pg_isready -U "$PG_USER" -d "$PG_DB"

            grep -Ev "^CREATE ROLE \"?${PG_USER}\"?;|^ALTER ROLE \"?${PG_USER}\"? " "${BACKUP_DIR}/roles.sql" \
              | docker exec -i "$NEW_CID" psql -U "$PG_USER" -d postgres -v ON_ERROR_STOP=0 >/dev/null || true

            for db in $DBS; do
              [ "$db" = "postgres" ] && continue
              exists=$(docker exec "$NEW_CID" psql -U "$PG_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='${db}';" || true)
              [ "$exists" = "1" ] || docker exec "$NEW_CID" psql -U "$PG_USER" -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"${db}\";"
              docker exec -i "$NEW_CID" pg_restore -U "$PG_USER" -d "$db" --clean --if-exists --no-owner --no-acl --exit-on-error < "${BACKUP_DIR}/${db}.dump"
              HASURA_TBL=$(docker exec "$NEW_CID" psql -U "$PG_USER" -d "$db" -tAc "SELECT to_regclass('hdb_catalog.hdb_source_catalog_version') IS NOT NULL;")
              if [ "$HASURA_TBL" = "t" ]; then
                docker exec "$NEW_CID" psql -U "$PG_USER" -d "$db" -v ON_ERROR_STOP=1 -c "ALTER TABLE hdb_catalog.hdb_source_catalog_version REPLICA IDENTITY FULL;"
              fi
            done

            docker exec "$NEW_CID" vacuumdb -U "$PG_USER" --all --analyze-only
            NEW_VER=$(docker exec "$NEW_CID" psql -U "$PG_USER" -d postgres -tAc "SHOW server_version;")
            CHECKSUMS=$(docker exec "$NEW_CID" psql -U "$PG_USER" -d postgres -tAc "SHOW data_checksums;")
            echo "CJD80 PG version=$NEW_VER | data_checksums=$CHECKSUMS"
            [[ "$NEW_VER" == 18.* ]] && [ "$CHECKSUMS" = "on" ]

            docker compose "${COMPOSE_ARGS[@]}" up -d
            if [ ${#APP_COMPOSE_ARGS[@]} -gt 0 ]; then
              docker compose "${APP_COMPOSE_ARGS[@]}" up -d
            fi
            for i in $(seq 1 25); do
              if curl -fsS --max-time 10 https://cjd80.fr/api/health >/dev/null 2>&1; then
                trap - ERR
                echo "CJD80 healthy sur PG $NEW_VER"
                exit 0
              fi
              sleep 3
            done
            docker logs --tail 60 cjd-app 2>/dev/null || true
            exit 1
